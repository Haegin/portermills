# XcodeGen spec. Generate the Xcode project with:  cd ios && xcodegen
# The generated Portermills.xcodeproj is not checked in.
name: Portermills
options:
  bundleIdPrefix: app.portermills
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your team here (or in Xcode) to run on a device; the simulator needs none.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Portermills:
    type: application
    platform: iOS
    sources: [Portermills]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.portermills
        INFOPLIST_FILE: Portermills/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        # Read at runtime from Info.plist (PMAPIBaseURL).
        Debug:
          API_BASE_URL: http://localhost:2310
        Release:
          API_BASE_URL: https://api.portermills.net
  PortermillsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PortermillsUITests]
    dependencies:
      - target: Portermills
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.portermills.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Portermills
schemes:
  Portermills:
    build:
      targets:
        Portermills: all
        PortermillsUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [PortermillsUITests]
